# Bird_IG pipeline configuration.
#
# The workflow reads and writes inside input_dir -- data is NOT versioned and
# does not live in the repo. See docs/data_layout.md for the directory layout.

input_dir: /local/storage/kav67/clean_birds

# Index table driving every rule. One row per haplotype x locus x contig.
# Built upstream (data_prep/create_summary_tables_clean.R from Daniel's
# ig_contig_list.csv); treated as a pipeline INPUT, not a rule output.
summary_features: summary_features.csv

# Loci to process. Inversion/D-gene/hairpin/paralog analyses are IGH-only by
# design; self-alignment and trees run for both.
loci: [IGH, IGL]

# Minimum inversion length. 250 is the only threshold used in this project.
min_inv_len: 250

# Minimum V genes for a contig to enter the inversion analyses. Matches the
# NumV > 2 filter that produced IGH_filtered_table.tsv.
min_numv: 3

# Seed for hairpin.py's random control windows, so palindromes.tsv is reproducible.
hairpin_seed: 1

lastz: lastz

# PatchWorkPlot (https://github.com/dirkschumacher/patchworkplot) is not on $PATH;
# point this at the checkout you want to use.
patchworkplot: /home/kav67/PatchWorkPlot_birds/PatchWorkPlot.py

# Orders to generate dot plots for. Each produces a config plus a patchworkplot
# PDF per locus. Empty means every order in the index.
dotplot_orders: []

# Figure 1C dot plot: a hand-picked cross-section rather than a whole order, so it
# gets its own config and its own target (`snakemake ... -- fig1c`). Species are
# given as {Species}/{Haplotype}; the label is what appears beside the panel.
fig1c_samples:
  - species: House_Finch
    haplotype: bHaeMex1.pri
    label: House Finch
  - species: Tawny_Owl
    haplotype: bStrAlu1_pri
    label: Tawny Owl
  - species: European_Golden_Plover
    haplotype: bPluApr1_pri
    label: European Golden Plover
  - species: White_Leghorn_Chicken
    haplotype: bGalGal1_pri
    label: White Leghorn Chicken
  - species: Common_Ostrich
    haplotype: bStrCam1_pri
    label: Common Ostrich

# Arguments passed through to PatchWorkPlot.py.
patchworkplot_args: "--show-annot --lower --lwidth 2 --min-len 15000 --cmap viridis --min-pi 75 --transparent"
